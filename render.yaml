services:
  - type: web
    name: aaroh-site
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NUXT_PUBLIC_SITE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NUXT_FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: NUXT_STUDIO_ADMIN_EMAIL
        sync: false
      - key: NUXT_STUDIO_EMAIL
        sync: false
      - key: NUXT_STUDIO_PASSWORD
        sync: false
      - key: NUXT_STUDIO_SESSION_SECRET
        sync: false
      - key: NUXT_FIREBASE_AUTH_BASE_URL
        sync: false
      - key: NUXT_SMTP_HOST
        sync: false
      - key: NUXT_SMTP_PORT
        sync: false
      - key: NUXT_SMTP_USER
        sync: false
      - key: NUXT_SMTP_PASSWORD
        sync: false
      - key: NUXT_SMTP_FROM
        sync: false
